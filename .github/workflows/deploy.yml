name: Deploy

# A release is made on a developer's machine with `bun run release:patch`, `release:minor` or
# `release:major` (scripts/release.ts), which bumps the version in package.json, commits it, tags the
# commit vX.Y.Z and pushes both. The tag starts this workflow, which checks the commit again, builds the
# site, publishes it to GitHub Pages and creates the GitHub Release. The tag is pushed from a machine
# because a tag pushed with a workflow's own token does not start other workflows.
#
# To publish a tag again, run it from the Actions tab and choose the tag under "Use workflow from".
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

# Deployments run one at a time, and a running one is never cancelled halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, to see whether the tag is on the default branch.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Check the Bun version
        run: test "$(bun --version)" = "$(cat .bun-version)"
      # Only code that is on the default branch, and has been through its checks, may be released.
      - name: Check the tag is on the default branch
        if: startsWith(github.ref, 'refs/tags/')
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::The tag $GITHUB_REF_NAME is not on $DEFAULT_BRANCH, so it is not released."
            exit 1
          fi
      - name: Check the tag matches the version in package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(bun -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Verify
        run: bun run verify
      - name: Check the Svelte files
        run: bun run check:svelte
      # Builds the site into build/ itself, so it runs before the build that is published.
      - name: Lighthouse, Trust and Safety
        run: bun run lighthouse
      # Knows where Pages serves the site: /resume for a project site, nothing for a custom domain.
      - id: pages
        uses: actions/configure-pages@v6
      - name: Build
        run: bun run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Check the h-card
        run: bun run check:hcard
      - name: Check the Content Security Policy
        run: bun run check:security
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build
          include-hidden-files: true

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  release:
    name: release
    needs: deploy
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # A release created in the GitHub UI exists already; one made by `git push --tags` does not.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
