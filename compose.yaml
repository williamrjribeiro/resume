# Bead Me Up, Scotty — local Beads UI (not an npm dependency).
# Image: docker/scotty/Dockerfile pins upstream v0.3.0; bundled bd 1.3.1 matches @beads/bd.
# Built and run with Bun only (oven/bun, no Node.js).
#
# Prerequisites: Docker, or Podman + Docker CLI compat (`podman-docker`) so `docker compose` works.
# Full runbook: .agents/skills/scotty/SKILL.md.
#
# Host port: SCOTTY_PORT (default 3000).
#
# Container user (SCOTTY_USER, default 1001:1001 = image nextjs):
#   Rootless Podman cannot read host .beads (mode 600/700) as 1001 or as $(id -u):
#     SCOTTY_USER=0:0 bun run scotty:up
#     (container root == host user under rootless mapping; verified on Arch)
#   Docker Desktop / rootful Docker, if .beads is not writable as 1001:
#     SCOTTY_USER="$(id -u):$(id -g)" bun run scotty:up
#   Or chmod -R a+rX .beads and keep the default image user.
#
# Config volume survives `bun run scotty:down` (not `docker compose down -v`).
# Image mkdir's /home/nextjs/.config/bead-me-up-scotty (0777) so the volume is writable.
# Dolt sync stays on the host: bun run beads:push / bun run beads:latest
# scotty:up runs beads:latest before starting the container.

name: bun-agentic-starter

services:
  scotty:
    container_name: starter-scotty
    build:
      context: docker/scotty
      dockerfile: Dockerfile
      args:
        SCOTTY_VERSION: v0.3.0
        BD_VERSION: "1.3.1"
    image: starter-scotty:v0.3.0
    ports:
      - "${SCOTTY_PORT:-3000}:3000"
    environment:
      BEADS_REPO: /data
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    volumes:
      - type: bind
        source: .
        target: /data
      - scotty-config:/home/nextjs/.config/bead-me-up-scotty
    # Default: image nextjs user. Rootless Podman + mode 600/700 .beads → SCOTTY_USER=0:0
    # Docker Desktop / rootful, if needed → SCOTTY_USER="$(id -u):$(id -g)"
    user: "${SCOTTY_USER:-1001:1001}"
    restart: unless-stopped

volumes:
  scotty-config:
